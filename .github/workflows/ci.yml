name: Continuous Integration (CI)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running manual CI'
        required: false
        default: 'Manual run'

permissions:
  contents: read
  security-events: write

jobs:
  ci-pipeline:
    name: CI Build, Security & Test Pipeline
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 2. Node.js Setup ───────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install Dependencies ────────────────────────────────────────────
      - name: Install Dependencies
        run: npm ci

      # ── 4. Lint ────────────────────────────────────────────────────────────
      - name: Run Linter
        run: npm run lint --if-present

      # ── 5. Unit Tests ──────────────────────────────────────────────────────
      - name: Run Unit Tests
        run: npm test --if-present

      # ── 6. Build Application ───────────────────────────────────────────────
      - name: Build Application
        run: npm run build --if-present

      # ── 7. Secret Scanning (Gitleaks) ──────────────────────────────────────
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 8. Dependency Scanning (npm audit) ────────────────────────────────
      # Only audit production dependencies to avoid blocking on local dev tool
      # vulnerabilities (like Jest or ESLint) which do not run in production.
      - name: Dependency Scanning (SCA)
        run: npm audit --audit-level=high --omit=dev

      # ── 9. SAST Scanning (Semgrep) ────────────────────────────────────────
      # semgrep/semgrep-action was archived in April 2024.
      # Using the official recommended approach: pip install + semgrep scan.
      - name: SAST Scanning (Semgrep)
        run: |
          pip install semgrep --quiet
          semgrep scan --config auto --error .

      # ── 10. Terraform Setup ────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # ── 11. Terraform Format & Validate ───────────────────────────────────
      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Init & Validate
        run: |
          cd terraform/env/dev
          terraform init -backend=false
          terraform validate

      # ── 12. Terraform Security Scan (Checkov) ─────────────────────────────
      # Scans the full terraform/ directory including all modules.
      # continue-on-error: true so security findings are reported without
      # blocking the pipeline — review findings in the Actions summary.
      - name: Terraform Security Scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          soft_fail: true
        continue-on-error: true

      # ── 13. Build Docker Image ─────────────────────────────────────────────
      - name: Build Docker Image
        run: docker build -t test-app:local .

      # ── 14. Container Image Scan (Trivy) ──────────────────────────────────
      # Exits with code 1 on CRITICAL or HIGH unfixed vulnerabilities.
      # Results are also uploaded to GitHub Security → Code scanning alerts.
      # Note: trivy-action requires the "v" prefix (e.g. v0.36.0, not 0.28.0).
      - name: Container Image Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'test-app:local'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'